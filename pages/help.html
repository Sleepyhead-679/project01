<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
    <style>
        .help-section { margin-bottom: 24px; }
        .help-section h3 { color: #333; font-size: 18px; margin-bottom: 12px; }
        .help-section p { color: #666; line-height: 1.6; margin-bottom: 8px; }
        .help-section ul { padding-left: 20px; color: #666; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="help-section">
        <h3>📖 帮助中心</h3>
        <p>欢迎使用用户管理系统！以下是常见功能的操作指南：</p>
    </div>

    <div class="help-section">
        <h3>🔐 登录与注册</h3>
        <ul>
            <li>新用户可通过注册页面创建账号</li>
            <li>支持使用用户名和密码登录</li>
            <li>预置账号：admin / alice</li>
        </ul>
    </div>

    <div class="help-section">
        <h3>🔍 用户搜索</h3>
        <ul>
            <li>登录后可在首页搜索框中输入关键词</li>
            <li>支持按用户名或邮箱模糊搜索</li>
        </ul>
    </div>

    <div class="help-section">
        <h3>🖼️ 头像上传</h3>
        <ul>
            <li>支持 PNG、JPG、GIF、WEBP、BMP 格式</li>
            <li>文件大小限制为 16MB</li>
            <li>上传后导航栏显示圆形头像</li>
        </ul>
    </div>

    <div class="help-section">
        <h3>💰 充值</h3>
        <ul>
            <li>在个人中心页面可进行充值</li>
            <li>单次充值金额范围为 0.01 ~ 100,000 元</li>
        </ul>
    </div>
</body>
</html>
