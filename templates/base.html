<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand">用户管理系统</span>
        </div>
        <div class="nav-right">
            {% if session.get("username") %}
                <span class="nav-welcome">欢迎，{{ session["username"] }}</span>
                <a href="/upload" class="nav-avatar-link" title="修改头像">
                    {% if session_avatar %}
                        <img src="{{ session_avatar }}" alt="头像" class="nav-avatar">
                    {% else %}
                        <span class="nav-link">上传头像</span>
                    {% endif %}
                </a>
                <a href="/profile" class="nav-link">个人中心</a>
                <a href="/logout" class="nav-link">退出</a>
            {% else %}
                <a href="/register" class="nav-link">注册</a>
                <a href="/login" class="nav-link">登录</a>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
