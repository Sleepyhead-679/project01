{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>个人中心</h2>

    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    {% if user %}
        <div class="user-info">
            <ul>
                <li><span class="label">ID：</span>{{ user.id }}</li>
                <li><span class="label">用户名：</span>{{ user.username }}</li>
                <li><span class="label">邮箱：</span>{{ user.email }}</li>
                <li><span class="label">手机：</span>{{ user.phone }}</li>
                <li><span class="label">余额：</span>{{ user.balance }}</li>
            </ul>
        </div>

        <div class="recharge-section" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #f0f0f0;">
            <h3 style="margin-bottom: 16px; font-size: 18px; color: #333;">充值</h3>
            <form method="post" action="/recharge" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label for="amount">充值金额</label>
                    <input type="number" id="amount" name="amount" placeholder="请输入充值金额（1~100,000）" min="0.01" max="100000" step="0.01" required>
                </div>
                <button type="submit" class="btn">充值</button>
            </form>
        </div>
    {% else %}
        <div class="error-msg">无法获取用户信息</div>
        <p style="margin-top: 16px;"><a href="/" style="color: #667eea;">返回首页</a></p>
    {% endif %}
</div>
{% endblock %}
